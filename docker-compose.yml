# The whole bridge on one machine: Apache Kafka and the API in demo mode, which brings an emulated
# Dynamics 365, the simulated payments platform and a sales team, and runs the consumers, the outbox
# relay and the reconciler. Open http://localhost:8080 for the operations console.
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  bridge:
    build: { context: ., target: api }
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Bridge__Demo: "true"
      Bridge__Kafka__BootstrapServers: kafka:9092
    ports: ["8080:8080"]
