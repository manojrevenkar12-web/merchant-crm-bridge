# Temporary: collects the open-source NuGet packages this project uses into a branch, so a
# development machine without access to nuget.org can restore offline. Deleted when done.
name: vendor-nuget
on:
  push:
    branches: [tooling/nuget-request]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Restore the packages into the cache
        run: |
          set -ex
          dotnet --version
          mkdir -p w && cd w
          dotnet new classlib -o lib -f net10.0
          cd lib
          for p in xunit.v3 xunit.runner.visualstudio Microsoft.NET.Test.Sdk coverlet.collector \
                   Microsoft.AspNetCore.Mvc.Testing Confluent.Kafka Testcontainers.Kafka Azure.Identity \
                   Microsoft.AspNetCore.Authentication.JwtBearer HotChocolate.AspNetCore HotChocolate.Data \
                   Microsoft.Extensions.TimeProvider.Testing; do
            dotnet add package "$p"
          done
          dotnet restore
          cd ..
          mkdir fn && cd fn
          cat > fn.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <AzureFunctionsVersion>v4</AzureFunctionsVersion>
              <OutputType>Exe</OutputType>
            </PropertyGroup>
          </Project>
          XML
          cat > Program.cs <<'CS'
          using Microsoft.Extensions.Hosting;
          var host = new HostBuilder().ConfigureFunctionsWorkerDefaults().Build();
          host.Run();
          CS
          for p in Microsoft.Azure.Functions.Worker Microsoft.Azure.Functions.Worker.Sdk \
                   Microsoft.Azure.Functions.Worker.Extensions.Kafka Microsoft.Azure.Functions.Worker.Extensions.Timer \
                   Microsoft.Azure.Functions.Worker.Extensions.Http.AspNetCore \
                   Microsoft.Azure.Functions.Worker.ApplicationInsights Microsoft.ApplicationInsights.WorkerService; do
            dotnet add package "$p"
          done
          dotnet build
          cd ../..
          (cd w/lib && dotnet list package --include-transitive) > versions.txt
          (cd w/fn && dotnet list package) >> versions.txt
      - name: Commit the packages to a branch
        run: |
          set -ex
          mkdir out && cd out
          git init -q -b tooling/nuget-cache
          mkdir packages
          find ~/.nuget/packages -name '*.nupkg' ! -iname 'microsoft.crmsdk*' -exec cp {} packages/ \;
          cp ../versions.txt .
          printf 'Temporary package cache for offline development; generated by CI, deleted when done.\n' > README.md
          ls packages | wc -l; du -sh packages
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "NuGet package cache"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tooling/nuget-cache
